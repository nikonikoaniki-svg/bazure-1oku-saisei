<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たてがき400</title>
<style>
  :root{
    --cell: 30px;
    --line: #b8a98a;
    --paper: #fffdf7;
    --ink: #222;
    --active: #dbeafe;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
    background:#f4f1e8;
    color:#222;
  }
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px 14px;
    background:rgba(255,255,255,.96);
    border-bottom:1px solid #ddd;
  }
  h1{font-size:18px; margin:0 14px 0 0}
  button{
    font:inherit; padding:8px 12px; border:1px solid #aaa; border-radius:8px;
    background:white; cursor:pointer;
  }
  button:hover{background:#f6f6f6}
  #count{margin-left:auto; font-weight:700}
  main{padding:18px; overflow:auto;}
  #paperWrap{
    position:relative;
    width:max-content;
    margin:auto;
    padding:10px;
    background:var(--paper);
    box-shadow:0 3px 16px rgba(0,0,0,.12);
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(20,var(--cell));
    grid-template-rows:repeat(20,var(--cell));
    direction:rtl;
    border-top:1px solid var(--line);
    border-right:1px solid var(--line);
    background:var(--paper);
  }
  .cell{
    width:var(--cell); height:var(--cell);
    border-left:1px solid var(--line);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
    font-size:20px;
    line-height:1;
    color:var(--ink);
    user-select:none;
    position:relative;
    overflow:visible;
  }
  .cell.active{background:var(--active)}
  .glyph{
    display:inline-block;
    position:relative;
    line-height:1;
    transform-origin:center;
  }

  /* 句読点：縦組みではマスの右上 */
  .glyph.kuten,
  .glyph.touten{
    position:absolute;
    top:2px;
    right:3px;
    font-size:18px;
    line-height:1;
  }

  /* 中黒などは中央 */
  .glyph.center-punct{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* 縦書き括弧：CSS文字の回転で自然な向きに */
  .glyph.bracket{
    transform:rotate(90deg);
  }

  /* 横向きが自然な欧文・単独算用数字 */
  .glyph.rotate{
    transform:rotate(90deg);
  }

  /* 長音符など */
  .glyph.longmark{
    transform:rotate(90deg);
  }

  #ime{
    position:absolute;
    z-index:10;
    width:var(--cell);
    height:var(--cell);
    margin:0;
    padding:0;
    border:0;
    outline:2px solid #2563eb;
    outline-offset:-2px;
    background:transparent;
    color:transparent;
    caret-color:#2563eb;
    font-size:20px;
    resize:none;
    overflow:hidden;
    opacity:.035;
  }
  #status{
    margin-top:10px;
    font-size:13px;
    color:#555;
    text-align:center;
  }
  @media(max-width:720px){
    :root{--cell:28px}
    main{padding:8px}
  }
</style>
</head>
<body>
<header>
  <h1>たてがき400</h1>
  <button id="clearBtn">全部消す</button>
  <button id="copyBtn">コピー</button>
  <button id="saveBtn">保存</button>
  <span id="count">0 / 400字</span>
</header>

<main>
  <div id="paperWrap">
    <div id="grid" aria-label="20文字×20列の縦書き原稿用紙"></div>
    <textarea id="ime" rows="1" aria-label="縦書き入力"></textarea>
  </div>
  <div id="status">右上から下へ入力し、20字で左の列へ移ります。Backspaceで1字消せます。</div>
</main>

<script>
(() => {
  const ROWS=20, COLS=20, LIMIT=400;
  const grid=document.getElementById('grid');
  const ime=document.getElementById('ime');
  const count=document.getElementById('count');
  const status=document.getElementById('status');

  /*
    禁則処理
    noStart: 行頭禁止文字
    noEnd  : 行末禁止文字
    日本語組版で一般的なものを広めに収録
  */
  const noStart=new Set([...
    `、。，．・：；？！‼⁉⁈⁇）」』】〕〉》］｝〙〗〟’”»` +
    `ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ` +
    `ー〜～…‥ゝゞ々ヽヾ〻` +
    `・`
  ]);

  const noEnd=new Set([...
    `（〔［｛〈《「『【〘〖〝‘“«`
  ]);

  const openingBrackets=new Set([...
    `（〔［｛〈《「『【〘〖〝‘“«`
  ]);
  const closingBrackets=new Set([...
    `）〕］｝〉》」』】〙〗〟’”»`
  ]);

  const cells=[];
  let text='';
  let composing=false;

  for(let c=0;c<COLS;c++){
    for(let r=0;r<ROWS;r++){
      const div=document.createElement('div');
      div.className='cell';
      div.dataset.index=c*ROWS+r;
      div.addEventListener('click',()=>{
        placeIme();
        ime.focus();
      });
      grid.appendChild(div);
      cells.push(div);
    }
  }

  // 固定20マスのため、ぶら下げではなく「追い出し・追い込み」で処理する
  function layout(str){
    const chars=[...str].slice(0,LIMIT);
    const cols=[];
    let i=0;

    while(i<chars.length && cols.length<COLS){
      let remaining=chars.length-i;
      let take=Math.min(ROWS, remaining);

      // 行末禁止文字が20字目に来る場合、19字で折る
      if(take===ROWS && noEnd.has(chars[i+take-1])){
        take=Math.max(1, take-1);
      }

      // 次列先頭が行頭禁止になる場合、現在列を1字短くして禁則文字を次々調整
      // 固定20マスなので、禁則文字の直前から次列へ送る方式
      while(take>1 && i+take<chars.length && noStart.has(chars[i+take])){
        take--;
      }

      // 「開き括弧 + 1文字」などが列末で分断されにくいよう補正
      if(take>=1 && i+take<chars.length){
        const last=chars[i+take-1];
        if(openingBrackets.has(last) && take>1){
          take--;
        }
      }

      const line=chars.slice(i,i+take);
      cols.push(line);
      i+=take;
    }
    return cols;
  }

  function classify(ch){
    if(ch==='。') return 'kuten';
    if(ch==='、') return 'touten';
    if(ch==='・' || ch==='：' || ch==='；') return 'center-punct';
    if(openingBrackets.has(ch) || closingBrackets.has(ch)) return 'bracket';
    if(ch==='ー' || ch==='〜' || ch==='～') return 'longmark';

    // 算用数字・欧文は1文字単位で横倒し
    if(/[0-9A-Za-z]/.test(ch)) return 'rotate';

    return '';
  }

  function render(){
    cells.forEach(c=>{
      c.textContent='';
      c.classList.remove('active');
    });

    const cols=layout(text);
    let used=0;

    cols.forEach((line,c)=>{
      line.forEach((ch,r)=>{
        if(c>=COLS || r>=ROWS) return;
        const idx=c*ROWS+r;
        const sp=document.createElement('span');
        const cls=classify(ch);
        sp.className='glyph'+(cls?' '+cls:'');
        sp.textContent=ch;
        cells[idx].appendChild(sp);
        used++;
      });
    });

    if(used<LIMIT && cells[used]) cells[used].classList.add('active');
    count.textContent=`${[...text].length} / ${LIMIT}字`;
    placeIme();
    localStorage.setItem('tategaki400_text_v2',text);
  }

  function placeIme(){
    const used=Math.min([...text].length,LIMIT-1);
    const cell=cells[used];
    if(!cell) return;
    const wrap=document.getElementById('paperWrap').getBoundingClientRect();
    const rect=cell.getBoundingClientRect();
    ime.style.left=(rect.left-wrap.left)+'px';
    ime.style.top=(rect.top-wrap.top)+'px';
  }

  function insertCommitted(s){
    if(!s) return;
    s=s.replace(/[\r\n\t]/g,'');
    const remain=LIMIT-[...text].length;
    if(remain<=0){
      status.textContent='400字に達しています。';
      ime.value='';
      return;
    }
    text += [...s].slice(0,remain).join('');
    ime.value='';
    render();
  }

  ime.addEventListener('compositionstart',()=>composing=true);
  ime.addEventListener('compositionend',e=>{
    composing=false;
    insertCommitted(e.data || ime.value);
  });
  ime.addEventListener('input',()=>{
    if(composing) return;
    if(ime.value) insertCommitted(ime.value);
  });
  ime.addEventListener('keydown',e=>{
    if(e.key==='Backspace' && !composing){
      e.preventDefault();
      const a=[...text];
      a.pop();
      text=a.join('');
      ime.value='';
      render();
    }
    if(e.key==='Enter' || e.key==='Tab'){
      e.preventDefault();
    }
  });

  window.addEventListener('resize',placeIme);

  document.getElementById('clearBtn').addEventListener('click',()=>{
    if(confirm('すべての文字を消しますか？')){
      text='';
      render();
      ime.focus();
    }
  });

  document.getElementById('copyBtn').addEventListener('click',async()=>{
    try{
      await navigator.clipboard.writeText(text);
      status.textContent='文章をコピーしました。';
    }catch{
      status.textContent='コピーできませんでした。';
    }
  });

  document.getElementById('saveBtn').addEventListener('click',()=>{
    const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='tategaki400.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  text=localStorage.getItem('tategaki400_text_v2')
    || localStorage.getItem('tategaki400_text')
    || '';
  text=[...text].slice(0,LIMIT).join('');
  render();
  setTimeout(()=>ime.focus(),100);
})();
</script>
</body>
</html>
