<!doctype html>
<html lang="ja">
<head>

<title>バズれ、1億再生！スター誕生☆</title>
<style>
:root{
  --bg:#0d1020;--panel:#171b31;--panel2:#202641;--text:#f8f8ff;--muted:#aeb5d1;
  --accent:#ffd84d;--accent2:#ff70b8;--good:#55df9f;--bad:#ff7d7d;--line:#343b60;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#22284a 0,#0d1020 48%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
#app{width:min(100%,720px);margin:0 auto;min-height:100vh;padding:18px 14px 40px}
.card{background:rgba(23,27,49,.96);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.center{text-align:center}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}
.logo{font-size:clamp(32px,8vw,54px);font-weight:1000;line-height:1.05;letter-spacing:-.04em;margin:22px 0 10px}.logo span{color:var(--accent)}
.subtitle{color:var(--muted);line-height:1.75}
.primary,.secondary,.ghost{border:0;border-radius:14px;padding:14px 18px;font-weight:900;transition:.15s transform,.15s opacity}.primary:active,.secondary:active,.ghost:active{transform:scale(.98)}
.primary{background:linear-gradient(135deg,var(--accent),#ffae4d);color:#221b00;width:100%;font-size:18px}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);width:100%}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.actions{display:grid;gap:10px;margin-top:18px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:#11162b;border:1px solid var(--line);font-size:15px;font-weight:800;color:#dfe4ff}.progress{height:16px;background:#0f1327;border-radius:999px;overflow:hidden;border:1px solid #2a3154}.progress>div{height:100%;background:linear-gradient(90deg,#ff6aad,#ffd84d);width:0;transition:width .6s ease}.status-left{display:grid;gap:10px}.status-name{font-size:34px;font-weight:1000;line-height:1.1;letter-spacing:-.03em}.status-sub{font-size:14px;color:var(--muted);font-weight:700}.status-right{text-align:right;display:grid;gap:6px;justify-items:end}.status-stars{font-size:28px;letter-spacing:5px;color:var(--accent);line-height:1}.status-rank-name{font-size:18px;font-weight:900}.status-panel{margin-top:18px;padding:18px;border-radius:18px;background:linear-gradient(180deg,#11162b,#171d36);border:1px solid var(--line)}.status-value{font-size:clamp(26px,6.8vw,42px);font-weight:1000;letter-spacing:-.03em;margin:4px 0 10px}.status-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:#dfe4ff}
.status-identity{display:flex;align-items:center;gap:12px;margin-top:8px}.status-thumb{width:72px;height:72px;flex:0 0 72px;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#353c67,#171b31);border:1px solid #4a527c;display:flex;align-items:flex-end;justify-content:center}.status-thumb img{width:100%;height:100%;object-fit:cover;object-position:center 20%}.status-text{min-width:0}.status-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status-sub{margin-top:5px}
.big-number{font-size:clamp(36px,10vw,64px);font-weight:1000;letter-spacing:-.04em}.label{font-size:13px;color:var(--muted);margin-bottom:4px}.rank{font-size:24px;letter-spacing:3px;color:var(--accent)}
.field{display:grid;gap:8px;margin:18px 0}.field label{font-weight:800}.field input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#10152a;color:var(--text);outline:none}.form-error{display:none;margin:-8px 0 14px;padding:10px 12px;border-radius:12px;background:#3a2025;border:1px solid #7c444d;color:#ffd7d7;font-size:13px}.form-error.show{display:block}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{padding:14px;border-radius:16px;background:#11162b;color:var(--text);border:1px solid var(--line);font-weight:900;min-height:54px}.choice.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,216,77,.18) inset;background:#242541}
.avatar{width:180px;height:250px;margin:12px auto;border-radius:26px;background:linear-gradient(160deg,#353c67,#171b31);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #4a527c;box-shadow:0 18px 35px rgba(0,0,0,.25);overflow:hidden;padding:8px}.avatar .emoji{display:none}.avatar .charimg-wrap{flex:1;display:flex;align-items:flex-end;justify-content:center;width:100%;min-height:0}.avatar .charimg{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
.avatar.rankup{width:250px;height:345px;border-radius:32px;position:relative;z-index:2;background:linear-gradient(180deg,#4a4a7d,#1a1d38);border:1px solid rgba(255,255,255,.15);box-shadow:0 22px 50px rgba(0,0,0,.35),0 0 40px rgba(255,216,77,.18);padding:10px}
.avatar.rankup .emoji{display:none}

.rankup-card{position:relative;overflow:hidden;background:
 radial-gradient(circle at 50% -10%,rgba(255,216,77,.24),transparent 30%),
 radial-gradient(circle at 15% 25%,rgba(255,112,184,.22),transparent 26%),
 radial-gradient(circle at 85% 30%,rgba(109,213,250,.18),transparent 24%),
 linear-gradient(180deg,#211f44,#12162b 65%);
}
.rankup-card::before,.rankup-card::after{content:"";position:absolute;top:-40px;width:180px;height:380px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));filter:blur(4px);opacity:.45}
.rankup-card::before{left:8%;transform:rotate(18deg)}
.rankup-card::after{right:8%;transform:rotate(-18deg)}
.rankup-banner{display:inline-block;padding:8px 16px;border-radius:999px;background:linear-gradient(90deg,#ffd84d,#ff70b8);color:#221b00;font-size:13px;font-weight:1000;letter-spacing:.12em}
.rankup-title{font-size:clamp(28px,8vw,52px);font-weight:1000;letter-spacing:.04em;margin:14px 0 8px;color:#fff;text-shadow:0 4px 24px rgba(255,216,77,.35)}
.rankup-sub{font-size:clamp(20px,5vw,28px);font-weight:900;color:var(--accent);margin:8px 0 14px}
.rankup-stage{position:relative;padding:18px 0 8px}
.rankup-stars{font-size:26px;letter-spacing:4px;color:#ffe482;margin:8px 0}
.rankup-arrow{font-size:28px;color:#fff;opacity:.8;margin:8px 0}
.rankup-name{font-size:13px;color:#e6ebff;letter-spacing:.12em;text-transform:uppercase}
.rankup-note{margin-top:14px;line-height:1.7;color:#dfe4ff}
.rankup-note b{color:#fff}
.trends{display:grid;gap:9px;margin:16px 0}.trend{display:flex;justify-content:space-between;padding:11px 12px;border-radius:13px;background:#11162b;border:1px solid var(--line)}.up{color:var(--good);font-weight:900}.down{color:var(--bad);font-weight:900}
.word-section{margin-top:18px}.word-section h3{font-size:15px;margin:0 0 10px;color:#e9ecff}.words{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.word{min-height:76px;padding:10px 8px;border-radius:15px;background:#11162b;color:var(--text);border:1px solid var(--line);font-weight:900;line-height:1.25}.word.selected{border-color:var(--accent);background:#2b2942;box-shadow:0 0 0 2px rgba(255,216,77,.15) inset}.word small{display:block;color:var(--muted);font-weight:500;margin-top:6px}.word.trend-hit{border-color:#55df9f;box-shadow:0 0 0 2px rgba(85,223,159,.14) inset}.trend-badge{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;background:#17352d;color:#7bf1bc;font-size:10px;font-weight:900}.trend-note{margin-top:10px;padding:12px;border-radius:13px;background:#11162b;border:1px solid var(--line);color:#dfe4ff;line-height:1.6}.trend-note b{color:var(--good)}
.title-preview{margin:20px 0;padding:18px;border-radius:18px;background:linear-gradient(135deg,#252a4b,#301f3c);border:1px solid #4a4770}.song-title{font-size:clamp(24px,7vw,40px);font-weight:1000;line-height:1.2;word-break:break-word}.meter-row{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:8px;margin:8px 0;font-size:13px}.meter{height:8px;background:#10152a;border-radius:999px;overflow:hidden}.meter>i{display:block;height:100%;background:linear-gradient(90deg,#6dd5fa,#ff70b8);border-radius:999px}
.release-wrap{padding:30px 0;text-align:center}.release-title{color:var(--muted);letter-spacing:.18em;font-weight:800}.counter{font-size:clamp(46px,14vw,86px);font-weight:1000;letter-spacing:-.05em;margin:18px 0}.happening{margin:16px 0;padding:16px;border-radius:18px;background:#2a1f36;border:1px solid #744e80;animation:pop .35s ease}.happening.good{background:#17352d;border-color:#34735f}.happening.bad{background:#3a2025;border-color:#7c444d}@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.result-list{display:grid;gap:10px;margin:14px 0}.result-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:14px;background:#11162b;border:1px solid var(--line)}.season-icon{font-size:22px}.record{padding:14px;border-radius:14px;background:#11162b;border:1px solid var(--line);margin-top:16px}.success{color:var(--accent);font-weight:1000}.fail{color:#c8cee7;font-weight:1000}
.test-badge{position:fixed;right:10px;bottom:10px;padding:6px 8px;border-radius:8px;background:#0009;color:#fff;font-size:10px;z-index:9}.divider{height:1px;background:var(--line);margin:18px 0}
.result-hero{position:relative;overflow:hidden;margin-bottom:18px;padding:20px 18px 18px;border-radius:24px;border:1px solid rgba(255,255,255,.12);text-align:center}
.result-hero::before{content:"";position:absolute;inset:-10% -20% auto -20%;height:70%;background:radial-gradient(circle at center,rgba(255,255,255,.18),rgba(255,255,255,0) 60%);pointer-events:none}
.result-hero .mini{position:relative;z-index:1;font-size:12px;letter-spacing:.2em;color:#f5f6ffb8;font-weight:900}
.result-hero .hero-title{position:relative;z-index:1;font-size:clamp(30px,8vw,52px);font-weight:1000;letter-spacing:.04em;line-height:1.08;margin:8px 0 6px;text-shadow:0 6px 24px rgba(0,0,0,.28)}
.result-hero .hero-sub{position:relative;z-index:1;font-size:18px;font-weight:900;margin-bottom:10px}
.result-hero .hero-copy{position:relative;z-index:1;max-width:38em;margin:12px auto 0;color:#eef1ff;line-height:1.7}
.result-hero .hero-stars{position:relative;z-index:1;font-size:28px;letter-spacing:4px;margin:10px 0;color:#fff3b0}
.result-hero .avatar-wrap{position:relative;z-index:1}
.result-hero.legend{background:linear-gradient(180deg,#5d215f,#241534 66%)}
.result-hero.legend .hero-title{color:#ffe17a}
.result-hero.national{background:linear-gradient(180deg,#6b4b12,#241934 66%)}
.result-hero.national .hero-title{color:#ffd84d}
.result-hero.popular{background:linear-gradient(180deg,#22476e,#151d38 66%)}
.result-hero.popular .hero-title{color:#9fdcff}
.result-hero.break{background:linear-gradient(180deg,#24563f,#151d2c 66%)}
.result-hero.break .hero-title{color:#9ef0c5}
.result-hero.challenger{background:linear-gradient(180deg,#3b3f66,#161b31 66%)}
.result-hero.challenger .hero-title{color:#d9deff}

.share-card{
  position:relative;
  overflow:hidden;
  width:100%;
  max-width:620px;
  margin:0 auto 18px;
  padding:22px 20px 20px;
  border-radius:28px;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 60px rgba(0,0,0,.34);
  text-align:center;
  background:linear-gradient(180deg,#252b50,#11162b 72%);
}
.share-card::before{
  content:"";
  position:absolute;
  inset:-15% -15% auto -15%;
  height:48%;
  background:radial-gradient(circle at center,rgba(255,255,255,.18),rgba(255,255,255,0) 65%);
  pointer-events:none;
}
.share-card.legend{background:linear-gradient(180deg,#6b276c,#241432 70%)}
.share-card.national{background:linear-gradient(180deg,#755315,#2a1b2d 70%)}
.share-card.popular{background:linear-gradient(180deg,#28547e,#151c35 70%)}
.share-card.break{background:linear-gradient(180deg,#286044,#151f2d 70%)}
.share-card.challenger{background:linear-gradient(180deg,#41466e,#171b31 70%)}
.share-brand{

}
.share-year{

}

  width:160px;height:195px;margin:10px auto 8px;
}

.share-artist{
  position:relative;z-index:1;

}
.share-profile{

}

}

.share-song-title{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;

.share-best{

.result-mini-avatar{width:138px;height:190px;margin:12px auto 6px;border-radius:22px;box-shadow:0 14px 28px rgba(0,0,0,.28),0 0 28px rgba(255,216,77,.10)}

  .share-card{padding:18px 14px 16px;border-radius:22px}

<script>
const fmt=n=>Math.max(0,Math.round(n)).toLocaleString('ja-JP');
function safeGet(key){try{return localStorage.getItem(key)}catch(e){return null}}
function safeSet(key,val){try{localStorage.setItem(key,val)}catch(e){}}
const seasons=[
 {key:'spring',icon:'🌸',en:'SPRING',jp:'春',base:6200000},
 {key:'summer',icon:'☀️',en:'SUMMER',jp:'夏',base:9800000},
 {key:'autumn',icon:'🍁',en:'AUTUMN',jp:'秋',base:14500000},
 {key:'winter',icon:'❄️',en:'WINTER',jp:'冬',base:22000000}
];
const genreInfo={
 '演歌':{emojiM:'👨🏻',emojiF:'👩🏻',costume:'和服',likes:['和風','人生','季節','恋愛']},
 'ロック':{emojiM:'👨🏻‍🎤',emojiF:'👩🏻‍🎤',costume:'革ジャン',likes:['夜','反抗','英語','青春']},
 'ポップス':{emojiM:'🧑🏻‍🎤',emojiF:'👩🏻‍🎤',costume:'カジュアル',likes:['恋愛','青春','日常','季節']},
 'アイドル':{emojiM:'🤴🏻',emojiF:'👸🏻',costume:'キラキラ衣装',likes:['恋愛','青春','キラキラ','食べ物']}
};

const characterImages={
 '男性|演歌':'images/male_enka.png',
 '女性|演歌':'images/female_enka.png',
 '男性|ロック':'images/male_rock.png',
 '女性|ロック':'images/female_rock.png',
 '男性|ポップス':'images/male_pops.png',
 '女性|ポップス':'images/female_pops.png',
 '男性|アイドル':'images/male_idol.png',
 '女性|アイドル':'images/female_idol.png'

 // 35%の確率でトレンド語なし、65%の確率で1語だけ出る。
 const showTrendWord=Math.random()<0.65;
 let trendInA=false;

 let hitA=null;

 if(showTrendWord){
   // AかBのどちらか一方だけに出す。
   if(Math.random()<0.5){
     const poolA=A.filter(x=>x.cat===state.trend.cat);
     if(poolA.length){
       hitA=sampleWithoutReplacement(poolA,1)[0];
       trendInA=true;
     }
   }else{
     const poolB=B.filter(x=>x.cat===state.trend.cat);
     if(poolB.length){

 }

 const nonTrendA=A.filter(x=>x.cat!==state.trend.cat);

 state.candidatesA=trendInA
   ? shuffle([hitA,...sampleWithoutReplacement(nonTrendA,2)]).slice(0,3)
   : sampleWithoutReplacement(nonTrendA,3);

 state.candidatesB=trendInB

 state.last={title:a.text+b.text,plays,h,trendCount:p.trendCount,debug:{base:seasons[state.season].base,rank:r.factor,titleMod,trendM,genreM,syn,randomM,yearLuck:state.yearLuck},rankBefore:r};nav('release')}

   <div class="record">
     <div class="label">今回の結果</div>
     <b>${success?'1億再生クリア！':'1億再生まであと '+fmt(Math.max(0,100000000-state.cum))+' 回'}</b>
   </div>
   <div class="actions">
     <button class="primary" onclick="restart()">もう一年挑戦する</button>
     <button class="secondary" onclick="nav('title')">タイトルへ</button>
   </div>
 </div>`)
}
function restart(){const n=state.name,g=state.gender,j=state.genre;resetState();state.name=n;state.gender=g;state.genre=j;state.screen='debut';render()}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
resetState();render();
</script>
</body>
</html>
